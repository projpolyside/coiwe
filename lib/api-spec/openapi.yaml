openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: search
    description: Coin search
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /search:
    get:
      operationId: searchCoins
      tags: [search]
      summary: Search coins by query
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SearchCoinItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        symbol:
          type: string
        market_cap_rank:
          type: ["integer", "null"]
        thumb:
          type: string
        large:
          type: string
      required:
        - id
        - name
        - symbol
        - thumb
        - large
    SearchResult:
      type: object
      properties:
        coins:
          type: array
          items:
            $ref: "#/components/schemas/SearchCoinItem"
      required:
        - coins
